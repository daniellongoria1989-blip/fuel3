<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fuel">
<meta name="theme-color" content="#ffffff">
<title>Fuel Tracker</title>
<style>
  :root {
    --bg: #ffffff; --surface: #f7f7f5; --surface-2: #efeeea; --border: #dcd9d2;
    --text: #16181c; --text-muted: #6b7280; --accent: #a8650a;
    --positive: #1f8f5f; --negative: #c73e33; --warn: #b7791f;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font);
    padding: env(safe-area-inset-top) 0 40px; -webkit-text-size-adjust: 100%; }
  .wrap { max-width: 520px; margin: 0 auto; padding: 12px 14px; }
  h1 { font-size: 1.15em; margin: 6px 2px 12px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 12px; }
  .section-title { font-size: 0.95em; font-weight: 700; margin: 0 0 8px; }
  label { display: block; font-size: 0.78em; color: var(--text-muted); margin: 10px 0 4px; }
  input, select { width: 100%; padding: 10px; background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 7px; color: var(--text); font-size: 1em; font-family: var(--font); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .btn { width: 100%; margin-top: 12px; padding: 12px; border: none; border-radius: 8px; background: var(--accent);
    color: #fff; font-weight: 700; font-size: 0.95em; font-family: var(--font); cursor: pointer; }
  .btn.secondary { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
  .check { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 0.92em; }
  .check input { width: 20px; height: 20px; }
  .muted { color: var(--text-muted); font-size: 0.8em; line-height: 1.45; }
  .num { font-variant-numeric: tabular-nums; }
  .tank-big { font-size: 2.3em; font-weight: 800; line-height: 1; }
  .bar { position: relative; height: 14px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 7px; margin: 12px 0 4px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--positive); }
  .bar-mark { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--negative); }
  .bar-mark.room { background: var(--accent); }
  .bar-legend { display: flex; justify-content: space-between; font-size: 0.72em; color: var(--text-muted); }
  .readouts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  .readout { background: var(--bg); border: 1px solid var(--border); border-radius: 9px; padding: 10px; }
  .readout .lbl { font-size: 0.72em; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.03em; }
  .readout .val { font-size: 1.45em; font-weight: 800; margin-top: 4px; }
  .readout .sub { font-size: 0.75em; color: var(--text-muted); margin-top: 2px; }
  .good { color: var(--positive); } .bad { color: var(--negative); } .warn { color: var(--warn); }
  table { width: 100%; border-collapse: collapse; font-size: 0.85em; }
  th, td { text-align: left; padding: 7px 4px; border-bottom: 1px solid var(--border); }
  th { font-size: 0.78em; color: var(--text-muted); font-weight: 600; }
  .rm { background: none; border: none; color: var(--negative); font-size: 1.1em; cursor: pointer; }
  details summary { cursor: pointer; font-weight: 700; font-size: 0.95em; }
  .tag { font-size: 0.72em; padding: 2px 7px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--border); }
  .tag.top { background: #e3f3eb; border-color: #b5dcc6; color: var(--positive); }
</style>
</head>
<body>
<div class="wrap">
  <h1>⛽ Fuel Tracker</h1>

  <!-- STATUS -->
  <div class="card" id="statusCard">
    <div id="statusWrap"></div>
  </div>

  <!-- QUICK CHECK -->
  <div class="card">
    <div class="section-title">Where am I?</div>
    <label>Current odometer</label>
    <input type="number" id="checkOdo" inputmode="decimal" placeholder="e.g. 412260">
    <button class="btn secondary" id="checkBtn">Update estimate</button>
  </div>

  <!-- ROUTE -->
  <div class="card">
    <div class="section-title">Plan a route</div>
    <div class="row2">
      <div><label>Route miles</label><input type="number" id="routeMiles" inputmode="decimal" placeholder="e.g. 640"></div>
      <div><label>Name (to save it)</label><input type="text" id="routeName" placeholder="optional"></div>
    </div>
    <div id="routeChips" style="display:flex;flex-wrap:wrap;gap:6px;margin-top:10px"></div>
    <div id="routeResult" style="margin-top:10px"></div>
    <button class="btn secondary" id="routeSaveBtn">Save route</button>
  </div>

  <!-- LOG FUEL -->
  <div class="card">
    <div class="section-title">Log fuel</div>
    <div class="row2">
      <div><label>Odometer</label><input type="number" id="fuelOdo" inputmode="decimal"></div>
      <div><label>Gallons pumped</label><input type="number" id="fuelGal" inputmode="decimal" step="0.001"></div>
    </div>
    <label class="check"><input type="checkbox" id="fuelTop"> Topped off (both tanks full)</label>
    <label class="check"><input type="checkbox" id="fuelOther"> Topped off (other driver drove truck)</label>
    <div class="muted" id="fuelHint" style="margin-top:6px"></div>
    <button class="btn" id="fuelBtn">Log fuel</button>
  </div>

  <!-- MPG -->
  <div class="card">
    <div class="section-title">MPG</div>
    <div id="mpgWrap"></div>
  </div>

  <!-- HISTORY -->
  <div class="card">
    <div class="section-title">Recent fuel log</div>
    <div id="historyWrap"></div>
  </div>

  <!-- SET LEVEL -->
  <div class="card">
    <details>
      <summary>Set tank level by hand</summary>
      <div class="muted" style="margin-top:8px">Use this to start out when you're not full, or if the estimate is clearly off. It restarts the estimate from what you enter.</div>
      <div class="row2">
        <div><label>Odometer</label><input type="number" id="setOdo" inputmode="decimal"></div>
        <div><label>Gallons in tanks</label><input type="number" id="setGal" inputmode="decimal"></div>
      </div>
      <button class="btn secondary" id="setBtn">Set level</button>
    </details>
  </div>

  <!-- SETTINGS -->
  <div class="card">
    <details>
      <summary>Settings</summary>
      <label>Mode</label>
      <select id="sMode">
        <option value="points">Chasing points - 50-gallon fills</option>
        <option value="topoff">Points maxed - topping off every time</option>
      </select>
      <div class="row2">
        <div><label>Total tank capacity (gal)</label><input type="number" id="sCap" inputmode="decimal"></div>
        <div><label>Reserve - never go below (gal)</label><input type="number" id="sRes" inputmode="decimal"></div>
      </div>
      <div class="row2">
        <div><label>Rewards fill size (gal)</label><input type="number" id="sFill" inputmode="decimal"></div>
        <div><label>Dash MPG (used until real readings exist)</label><input type="number" id="sMpg" inputmode="decimal" step="0.01"></div>
      </div>
      <label>MPG readings used for the average</label>
      <input type="number" id="sKeep" inputmode="numeric">
      <button class="btn secondary" id="saveSettingsBtn">Save settings</button>
      <div style="margin-top:16px" class="section-title">Backup</div>
      <button class="btn secondary" id="exportBtn">Export data (.json)</button>
      <button class="btn secondary" id="importBtn">Import data (.json)</button>
      <input type="file" id="importFile" accept=".json,application/json" style="display:none">
      <button class="btn secondary" id="resetBtn" style="color:var(--negative)">Reset everything</button>
    </details>
  </div>
</div>

<script>
// ================= Storage =================
const LS_KEY = 'fuel_tracker_v1';
const DEFAULT_SETTINGS = { capacity: 160, reserve: 50, fillSize: 50, dashMpg: 6.5, keep: 15, mode: 'points' };
const MAX_EVENTS = 100;   // older entries are folded into a saved snapshot, so totals and averages carry on

function blankState() {
  return { known: false, odo: null, gallons: 0, topOffOdo: null, sinceGal: 0, readings: [], lifeMiles: 0, lifeGal: 0 };
}
function load() {
  try {
    const d = JSON.parse(localStorage.getItem(LS_KEY));
    if (d && d.settings) return d;
  } catch (e) {}
  return null;
}
let data = load() || { settings: { ...DEFAULT_SETTINGS }, base: blankState(), events: [], lastCheck: null };
data.settings = { ...DEFAULT_SETTINGS, ...data.settings };

// IndexedDB copy so the data survives Safari clearing website storage
function idb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('fuel_tracker', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
async function idbSet(v) { try { const db = await idb(); db.transaction('kv', 'readwrite').objectStore('kv').put(v, 'data'); } catch (e) {} }
async function idbGet() {
  try { const db = await idb(); return await new Promise(res => { const q = db.transaction('kv').objectStore('kv').get('data'); q.onsuccess = () => res(q.result); q.onerror = () => res(null); }); }
  catch (e) { return null; }
}
function save() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(data)); } catch (e) { alert('Could not save - storage is blocked (Private Browsing?).'); }
  idbSet(JSON.stringify(data));
}

// ================= Math =================
// MPG used for estimates: gallon-weighted average of the last N real top-off readings,
// or the dash MPG until there are any.
function mpgFrom(readings) {
  const r = readings.slice(-data.settings.keep);
  const miles = r.reduce((s, x) => s + x.miles, 0), gal = r.reduce((s, x) => s + x.gallons, 0);
  return gal > 0 ? miles / gal : Number(data.settings.dashMpg);
}
function applyEvent(st, ev) {
  const cap = Number(data.settings.capacity);
  const s = { ...st, readings: st.readings.slice() };
  if (ev.type === 'set') {
    s.known = true; s.odo = ev.odo; s.gallons = Math.min(cap, Math.max(0, ev.gallons));
    s.topOffOdo = null; s.sinceGal = 0;          // MPG chain restarts at the next top-off
  } else if (ev.type === 'fuel') {
    const est = s.known ? s.gallons - (ev.odo - s.odo) / mpgFrom(s.readings) : null;
    if (ev.other) {
      // Other driver had the truck: tanks are full now, but no MPG reading, and the
      // next top-off starts a fresh stretch instead of measuring from here.
      s.topOffOdo = null; s.sinceGal = 0; s.partialSince = false; s.gallons = cap; s.known = true;
    } else if (ev.topOff) {
      // Real MPG only from two top-offs in a row - any partial fill in between means it was estimated, so no reading.
      if (s.topOffOdo !== null && !s.partialSince) {
        const miles = ev.odo - s.topOffOdo, gal = ev.gallons;
        if (miles > 0 && gal > 0) {
          s.readings.push({ id: ev.id, date: ev.date, miles, gallons: gal, mpg: miles / gal });
          s.lifeMiles += miles; s.lifeGal += gal;
          if (s.readings.length > 60) s.readings.shift();
        }
      }
      s.topOffOdo = ev.odo; s.sinceGal = 0; s.partialSince = false; s.gallons = cap; s.known = true;
    } else {
      if (s.known) s.gallons = Math.min(cap, Math.max(0, est) + ev.gallons);
      s.sinceGal += ev.gallons;
      s.partialSince = true;
    }
    s.odo = ev.odo;
  }
  return s;
}
function computeState() {
  let st = data.base;
  data.events.forEach(ev => { st = applyEvent(st, ev); });
  return st;
}
function trimEvents() {
  while (data.events.length > MAX_EVENTS) {
    data.base = applyEvent(data.base, data.events.shift());
  }
}
function lastOdo() {
  const st = computeState();
  const evOdo = st.odo;
  const c = data.lastCheck && data.lastCheck.odo;
  return Math.max(evOdo || 0, c || 0) || null;
}

// ================= Render =================
const fmt0 = n => Math.round(n).toLocaleString();
// Gallons in the tank right now (same math as the status card), or null if unknown.
function galNow() {
  const st = computeState();
  if (!st.known) return null;
  const curOdo = Math.max(st.odo, (data.lastCheck && data.lastCheck.odo) || 0);
  return st.gallons - (curOdo - st.odo) / mpgFrom(st.readings);
}
// How much to put in so you finish the route still at your reserve.
function renderRoute() {
  const S = data.settings, el = document.getElementById('routeResult');
  const miles = Number(document.getElementById('routeMiles').value);
  const routes = data.routes || [];
  document.getElementById('routeChips').innerHTML = routes.map((r, i) =>
    `<span class="tag" style="font-size:0.85em;padding:6px 10px;cursor:pointer" data-i="${i}">${r.name} · ${fmt0(r.miles)} mi <b data-del="${i}" style="color:var(--negative);margin-left:4px">✕</b></span>`).join('');
  document.querySelectorAll('#routeChips [data-i]').forEach(c => c.addEventListener('click', ev => {
    const i = Number(c.dataset.i);
    if (ev.target.dataset.del !== undefined) {
      if (!confirm(`Delete saved route "${routes[i].name}"?`)) return;
      data.routes.splice(i, 1); save(); renderRoute(); return;
    }
    document.getElementById('routeMiles').value = routes[i].miles;
    document.getElementById('routeName').value = '';
    renderRoute();
  }));
  if (!(miles > 0)) { el.innerHTML = '<div class="muted">Enter the route miles and it tells you how much fuel to put in so you finish at or above your ' + S.reserve + '-gal reserve.</div>'; return; }
  const gal = galNow();
  if (gal === null) { el.innerHTML = '<div class="muted">Log a top-off or set the tank level first.</div>'; return; }
  const mpg = mpgFrom(computeState().readings);
  const need = miles / mpg;                       // gallons the route burns
  const have = Math.max(0, gal);
  const add = Math.max(0, S.reserve + need - have);
  const room = S.capacity - have;
  const end = have + add - need;
  let html = `<div class="readout" style="margin-top:4px"><div class="lbl">Fuel for the whole route</div><div class="val num">${need.toFixed(0)} gal</div>
    <div class="sub">${fmt0(miles)} mi at ${mpg.toFixed(2)} MPG</div></div>`;
  let addLine;
  if (add <= 0) addLine = `You have about <b class="num">${have.toFixed(0)} gal</b>, enough for the route - you'd finish with about ${(have - need).toFixed(0)} gal (${((have - need) / S.capacity * 100).toFixed(0)}%).`;
  else if (add > room) addLine = `You have about <b class="num">${have.toFixed(0)} gal</b>. Even topped off (${room.toFixed(0)} gal) you'd finish with about ${Math.max(0, S.capacity - need).toFixed(0)} gal - <b class="bad">plan a fuel stop on the route.</b>`;
  else addLine = `You have about <b class="num">${have.toFixed(0)} gal</b>. Put in <b class="num">${Math.ceil(add)} gal</b> to run the route and still finish with your ${S.reserve}-gal reserve.` +
    (add < S.fillSize && S.fillSize <= room ? ` A ${S.fillSize}-gal fill covers it.` : '');
  html += `<div style="margin-top:8px;font-size:0.9em;line-height:1.45">${addLine}</div>`;
  el.innerHTML = html;
}
function render() {
  const S = data.settings;
  const st = computeState();
  const mpg = mpgFrom(st.readings);
  const sw = document.getElementById('statusWrap');
  if (!st.known) {
    sw.innerHTML = `<div class="section-title">Get started</div>
      <div class="muted">Next time you top off, log it below with <b>Topped off</b> checked. Or set the current level by hand near the bottom.</div>`;
  } else {
    const curOdo = Math.max(st.odo, (data.lastCheck && data.lastCheck.odo) || 0);
    const driven = curOdo - st.odo;
    const gal = st.gallons - driven / mpg;
    const roomLine = S.capacity - S.fillSize;                  // at or below this, a full rewards fill fits
    const milesToRoom = (gal - roomLine) * mpg;
    const milesToReserve = (gal - S.reserve) * mpg;
    const pct = v => Math.max(0, Math.min(100, v / S.capacity * 100));
    const roomVal = milesToRoom <= 0 ? '<span class="good">NOW</span>' : `<span class="num">${fmt0(milesToRoom)} mi</span>`;
    const roomSub = milesToRoom <= 0 ? `Tank can take ${S.fillSize} gal` : `until ${S.fillSize} gal fits`;
    let resVal, resSub;
    if (milesToReserve <= 0) { resVal = `<span class="bad">PAST</span>`; resSub = `${fmt0(-milesToReserve)} mi into your ${S.reserve}-gal reserve`; }
    else { resVal = `<span class="num ${milesToReserve < 150 ? 'warn' : ''}">${fmt0(milesToReserve)} mi</span>`; resSub = `before you hit ${S.reserve} gal`; }
    sw.innerHTML = `
      <div class="muted">Estimated in tanks</div>
      <div class="num" style="display:flex;align-items:baseline;gap:22px;flex-wrap:wrap">
        <div class="tank-big ${gal <= S.reserve ? 'bad' : ''}">${(Math.max(0, gal) / S.capacity * 100).toFixed(0)}% <span style="font-size:0.45em;font-weight:700">left</span></div>
        <div class="tank-big" style="font-size:1.6em">${(S.capacity - Math.max(0, gal)).toFixed(0)} <span style="font-size:0.5em;font-weight:700">gal used</span></div>
      </div>
      <div class="bar"><div class="bar-fill" style="width:${pct(gal)}%;background:${gal <= S.reserve ? 'var(--negative)' : (gal <= roomLine ? 'var(--accent)' : 'var(--positive)')}"></div>
        <div class="bar-mark" style="left:${pct(S.reserve)}%"></div><div class="bar-mark room" style="left:${pct(roomLine)}%"></div></div>
      <div class="bar-legend"><span>0</span><span>reserve ${S.reserve}</span><span>room for ${S.fillSize} at ${roomLine}</span><span>${S.capacity}</span></div>
      <div class="readouts">
        <div class="readout"><div class="lbl">Room for ${S.fillSize} gal</div><div class="val">${roomVal}</div><div class="sub">${roomSub}</div></div>
        <div class="readout"><div class="lbl">Fuel within</div><div class="val">${resVal}</div><div class="sub">${resSub}</div></div>
      </div>
      ${gal < 0 ? '<div class="bad" style="font-size:0.85em;margin-top:10px;font-weight:600">The estimate says the tanks are empty - did you miss logging a fill, or mistype an odometer? Log a top-off or set the level to reset it.</div>' : ''}
      <div class="muted" style="margin-top:10px">As of odometer <b class="num">${fmt0(curOdo)}</b> · ${fmt0(driven)} mi since last fuel · at ${mpg.toFixed(2)} MPG</div>`;
  }
  // MPG card
  const recent = st.readings.slice(-S.keep);
  const life = st.lifeGal > 0 ? (st.lifeMiles / st.lifeGal) : null;
  document.getElementById('mpgWrap').innerHTML = `
    <div class="readouts" style="margin-top:0">
      <div class="readout"><div class="lbl">Using now</div><div class="val num">${mpg.toFixed(2)}</div>
        <div class="sub">${recent.length ? `avg of last ${recent.length} top-off${recent.length > 1 ? 's' : ''}` : 'dash MPG (no top-off readings yet)'}</div></div>
      <div class="readout"><div class="lbl">Lifetime</div><div class="val num">${life ? life.toFixed(2) : '—'}</div>
        <div class="sub">${life ? fmt0(st.lifeMiles) + ' mi / ' + fmt0(st.lifeGal) + ' gal' : 'needs two top-offs'}</div></div>
    </div>
    <div class="muted" style="margin-top:8px">Dash setting: ${Number(S.dashMpg).toFixed(2)}${recent.length ? ` · real is ${(mpg - S.dashMpg >= 0 ? '+' : '')}${(mpg - S.dashMpg).toFixed(2)} vs dash` : ''}</div>
    ${recent.length ? '<table style="margin-top:8px"><tr><th>Date</th><th>Miles</th><th>Gal</th><th>MPG</th></tr>' +
      recent.slice().reverse().map(r => `<tr><td>${r.date}</td><td class="num">${fmt0(r.miles)}</td><td class="num">${r.gallons.toFixed(1)}</td><td class="num"><b>${r.mpg.toFixed(2)}</b></td></tr>`).join('') + '</table>' : ''}`;
  // History
  const ev = data.events.slice(-20).reverse();
  document.getElementById('historyWrap').innerHTML = ev.length
    ? '<table><tr><th>Date</th><th>Odometer</th><th>Fuel</th><th></th></tr>' + ev.map(e => `<tr>
        <td>${e.date}</td><td class="num">${fmt0(e.odo)}</td>
        <td>${e.type === 'set' ? `<span class="tag">set to ${e.gallons} gal</span>` : (e.other ? `${e.gallons ? `<span class="num">${e.gallons} gal</span> ` : ''}<span class="tag">topped off · other driver</span>` : `<span class="num">${e.gallons} gal</span> ${e.topOff ? '<span class="tag top">topped off</span>' : ''}`)}</td>
        <td style="text-align:right"><button class="rm" data-id="${e.id}">✕</button></td></tr>`).join('') + '</table>'
    : '<div class="muted">Nothing logged yet.</div>';
  document.querySelectorAll('#historyWrap .rm').forEach(b => b.addEventListener('click', () => {
    const e = data.events.find(x => x.id === b.dataset.id);
    if (!e || !confirm(`Delete the ${e.date} entry at odometer ${fmt0(e.odo)}? Estimates recalculate.`)) return;
    data.events = data.events.filter(x => x.id !== e.id);
    save(); render();
  }));
  // inputs
  document.getElementById('fuelTop').checked = S.mode === 'topoff';
  updateFuelHint();
  const lo = lastOdo();
  ['checkOdo', 'fuelOdo', 'setOdo'].forEach(id => { const el = document.getElementById(id); if (!el.value && lo) el.placeholder = 'last: ' + fmt0(lo); });
  fillSettings();
  renderRoute();
}
function updateFuelHint() {
  const top = document.getElementById('fuelTop').checked;
  if (document.getElementById('fuelOther').checked) {
    document.getElementById('fuelHint').textContent = 'Tanks are full after this. Does not count toward your MPG average - the next top-off starts a fresh stretch. Gallons are optional.';
    return;
  }
  document.getElementById('fuelHint').textContent = top
    ? 'Tanks are full after this. If your last fill was also a top-off, this logs a real MPG reading.'
    : 'Partial fill: adds the gallons to the estimate. No MPG reading until you top off twice in a row.';
}
document.getElementById('fuelTop').addEventListener('change', () => {
  if (document.getElementById('fuelTop').checked) document.getElementById('fuelOther').checked = false;
  updateFuelHint();
});
document.getElementById('fuelOther').addEventListener('change', () => {
  if (document.getElementById('fuelOther').checked) document.getElementById('fuelTop').checked = false;
  updateFuelHint();
});

// ================= Actions =================
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const newId = () => 'e' + Date.now() + Math.floor(Math.random() * 1000);
function checkOdoValue(odo) {
  if (!(odo > 0)) { alert('Enter the odometer.'); return false; }
  const lo = computeState().odo;
  if (lo && odo < lo) { alert(`That's below your last logged odometer (${fmt0(lo)}). Check the number.`); return false; }
  return true;
}
document.getElementById('checkBtn').addEventListener('click', () => {
  const el = document.getElementById('checkOdo');
  const odo = Number(el.value);
  if (!checkOdoValue(odo)) return;
  data.lastCheck = { odo, date: today() };
  el.value = ''; save(); render();
});
document.getElementById('fuelBtn').addEventListener('click', () => {
  const odo = Number(document.getElementById('fuelOdo').value);
  const gallons = Number(document.getElementById('fuelGal').value);
  const other = document.getElementById('fuelOther').checked;
  const topOff = other || document.getElementById('fuelTop').checked;
  if (!checkOdoValue(odo)) return;
  if (!other && !(gallons > 0)) { alert('Enter the gallons pumped.'); return; }
  data.events.push({ id: newId(), type: 'fuel', date: today(), odo, gallons: gallons > 0 ? gallons : 0, topOff, other });
  data.events.sort((a, b) => a.odo - b.odo);
  if (data.lastCheck && data.lastCheck.odo <= odo) data.lastCheck = null;
  trimEvents();
  document.getElementById('fuelOdo').value = ''; document.getElementById('fuelGal').value = '';
  document.getElementById('fuelOther').checked = false;
  save(); render();
});
document.getElementById('setBtn').addEventListener('click', () => {
  const odo = Number(document.getElementById('setOdo').value);
  const gallons = Number(document.getElementById('setGal').value);
  if (!checkOdoValue(odo)) return;
  if (!(gallons >= 0) || document.getElementById('setGal').value === '') { alert('Enter the gallons in the tanks.'); return; }
  data.events.push({ id: newId(), type: 'set', date: today(), odo, gallons });
  data.events.sort((a, b) => a.odo - b.odo);
  if (data.lastCheck && data.lastCheck.odo <= odo) data.lastCheck = null;
  trimEvents();
  document.getElementById('setOdo').value = ''; document.getElementById('setGal').value = '';
  save(); render();
});
function fillSettings() {
  const S = data.settings, set = (id, v) => { const el = document.getElementById(id); if (document.activeElement !== el) el.value = v; };
  set('sMode', S.mode); set('sCap', S.capacity); set('sRes', S.reserve); set('sFill', S.fillSize); set('sMpg', S.dashMpg); set('sKeep', S.keep);
}
document.getElementById('saveSettingsBtn').addEventListener('click', () => {
  const v = id => Number(document.getElementById(id).value);
  const S = { mode: document.getElementById('sMode').value, capacity: v('sCap'), reserve: v('sRes'), fillSize: v('sFill'), dashMpg: v('sMpg'), keep: Math.max(1, Math.round(v('sKeep'))) };
  if (!(S.capacity > 0) || !(S.dashMpg > 0) || S.reserve < 0 || S.fillSize <= 0) { alert('Check the settings - capacity, fill size and MPG must be above 0.'); return; }
  if (S.reserve + S.fillSize > S.capacity) { alert('Reserve plus fill size is more than the tanks hold.'); return; }
  data.settings = S; save(); render();
  alert('Settings saved.');
});
document.getElementById('sMode').addEventListener('change', () => {
  data.settings.mode = document.getElementById('sMode').value; save(); render();
});
document.getElementById('exportBtn').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify({ exportedAt: new Date().toISOString(), ...data }, null, 2)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'fuel-tracker-backup-' + today() + '.json';
  document.body.appendChild(a); a.click(); a.remove();
});
document.getElementById('importBtn').addEventListener('click', () => document.getElementById('importFile').click());
document.getElementById('importFile').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!d.settings || !Array.isArray(d.events) || !d.base) throw new Error();
      if (!confirm('Replace everything in the app with this backup?')) return;
      data = { settings: { ...DEFAULT_SETTINGS, ...d.settings }, base: d.base, events: d.events, lastCheck: d.lastCheck || null, routes: d.routes || [] };
      save(); render(); alert('Backup imported.');
    } catch (err) { alert("That doesn't look like a Fuel Tracker backup."); }
  };
  r.readAsText(f); e.target.value = '';
});
document.getElementById('resetBtn').addEventListener('click', () => {
  if (!confirm('Delete all fuel entries and MPG history? Settings are kept.')) return;
  data = { settings: data.settings, base: blankState(), events: [], lastCheck: null, routes: data.routes || [] };
  save(); render();
});

document.getElementById('routeMiles').addEventListener('input', renderRoute);
document.getElementById('routeSaveBtn').addEventListener('click', () => {
  const miles = Number(document.getElementById('routeMiles').value);
  const name = document.getElementById('routeName').value.trim();
  if (!(miles > 0)) { alert('Enter the route miles.'); return; }
  if (!name) { alert('Give the route a name to save it.'); return; }
  data.routes = (data.routes || []).filter(r => r.name.toLowerCase() !== name.toLowerCase());
  data.routes.push({ name, miles });
  document.getElementById('routeName').value = '';
  save(); renderRoute();
});

// ================= Start =================
(async () => {
  if (!localStorage.getItem(LS_KEY)) {
    const saved = await idbGet();
    if (saved) { try { const d = JSON.parse(saved); if (d && d.settings) { data = d; data.settings = { ...DEFAULT_SETTINGS, ...d.settings }; localStorage.setItem(LS_KEY, saved); } } catch (e) {} }
  }
  render();
})();
</script>
</body>
</html>
